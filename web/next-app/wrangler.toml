name = "mathua-web"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-13"
workers_dev = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
# API navigations must reach the Worker before the asset router serves the
# 404 page. Without this, a browser navigation to /api/auth/google/login is
# treated as a missing asset and never reaches the origin.
run_worker_first = true

[[routes]]
pattern = "mathua.com/*"
zone_name = "mathua.com"

[[routes]]
pattern = "www.mathua.com/*"
zone_name = "mathua.com"
