name = "mathua-web"
main = "cloudflare/worker.js"
compatibility_date = "2026-11-13"
workers_dev = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = false

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
# API navigations must reach the Worker before the asset router serves the
# 404 page. Without this, a browser navigation to /api/auth/google/login is
# treated as a missing asset and never reaches the origin.
run_worker_first = true

# Workers Builds runs `npx wrangler preview` for pull requests. Wrangler refuses
# that command without an explicit previews block, even when the block is empty.
# The preview build command still has to run the export build, because `out` is
# not committed and the Worker's assets binding reads it.
[previews]

[[routes]]
pattern = "mathua.com/*"
zone_name = "mathua.com"

[[routes]]
pattern = "www.mathua.com/*"
zone_name = "mathua.com"
