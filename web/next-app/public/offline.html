<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — Mathua</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0d0f;
        --text: #ffffff;
        --muted: #a8a8a8;
        --border: #595959;
        --accent: #449df0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: ui-monospace, 'IBM Plex Mono', monospace;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 32rem;
      }
      h1 {
        font-weight: 400;
        font-size: 1.4rem;
        letter-spacing: 0.02em;
        margin: 0 0 0.75rem;
      }
      p {
        color: var(--muted);
        font-size: 0.85rem;
        line-height: 1.6;
        margin: 0 0 1.5rem;
      }
      a {
        color: var(--accent);
        text-decoration: none;
        border: 1px solid var(--border);
        padding: 0.6rem 1.2rem;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      a:hover {
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        Mathua couldn't reach the network. Pages you visited recently may still
        be available — try reloading once you're back online.
      </p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
