<text x="65.0" y="315.0" font-size="14" font-family="serif" fill="#27ae60" text-anchor="middle">c²</text>
<text x="200" y="385" font-size="14" font-family="serif" fill="#333333" text-anchor="middle">Pythagorean Theorem: a² + b² = c²</text>
</svg>