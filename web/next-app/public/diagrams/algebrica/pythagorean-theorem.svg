<svg width="400px" height="400px" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<rect width="400" height="400" fill="white"/>
<line x1="40" y1="280" x2="280" y2="280" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<line x1="40" y1="280" x2="40" y2="100" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<line x1="280" y1="280" x2="40" y2="100" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
<polyline points="55,280 55,265 40,265" fill="none" stroke="#BABABA" stroke-width="1.5"/>
<polyline points="40,280 280,280 280,40 40,40" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
<text x="160" y="160" font-size="14" font-family="serif" fill="#e74c3c" text-anchor="middle">a²</text>
<polyline points="40,280 40,100 220,100 220,280" fill="none" stroke="#2980b9" stroke-width="1.5"/>
<text x="130" y="190" font-size="14" font-family="serif" fill="#2980b9" text-anchor="middle">b²</text>
