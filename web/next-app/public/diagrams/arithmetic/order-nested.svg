<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="180" y="28" font-size="14" fill="#BABABA" text-anchor="middle">brackets first, inside out</text>
  <g font-size="19" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <text x="180" y="85">2 × (3 + (4 − 1))</text>
  </g>
  <ellipse cx="212" cy="80" rx="62" ry="22" fill="none" stroke="#E6E6E6" stroke-width="2"/>
  <text x="212" y="55" font-size="12" fill="#E6E6E6" text-anchor="middle">innermost first: 4 − 1 = 3</text>
  <g font-size="19" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <text x="180" y="135">= 2 × (3 + 3) = 2 × 6 = 12</text>
  </g>
  <text x="180" y="175" font-size="12" fill="#8a8f98" text-anchor="middle">nested brackets: innermost first</text>
</svg>
