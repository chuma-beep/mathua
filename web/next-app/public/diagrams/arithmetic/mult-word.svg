<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="30" y="28" font-size="13" fill="#8a8f98">3 bags with 4 apples each</text>
  <g>
    <rect x="30" y="55" width="80" height="50" fill="none" stroke="#BABABA" stroke-width="2"/>
    <rect x="125" y="55" width="80" height="50" fill="none" stroke="#BABABA" stroke-width="2"/>
    <rect x="220" y="55" width="80" height="50" fill="none" stroke="#BABABA" stroke-width="2"/>
  </g>
  <g font-size="13" fill="#BABABA" text-anchor="middle">
    <text x="70" y="83">4</text><text x="165" y="83">4</text><text x="260" y="83">4</text>
  </g>
  <text x="30" y="140" font-size="14" fill="#BABABA">3 × 4 = 12 apples total</text>
  <text x="30" y="165" font-size="12" fill="#8a8f98">equal groups → multiply</text>
</svg>
