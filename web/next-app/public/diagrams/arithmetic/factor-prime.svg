<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="30" y="28" font-size="14" fill="#BABABA">primes have exactly two factors</text>
  <g font-size="13" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <text x="70" y="80">2: 1, 2</text>
    <text x="70" y="105">3: 1, 3</text>
    <text x="70" y="130">5: 1, 5</text>
    <text x="70" y="155">7: 1, 7</text>
  </g>
  <g font-size="13" fill="#8a8f98" text-anchor="middle" font-family="monospace">
    <text x="220" y="80">4: 1, 2, 4</text>
    <text x="220" y="105">6: 1, 2, 3, 6</text>
    <text x="220" y="130">8: 1, 2, 4, 8</text>
  </g>
  <text x="70" y="55" font-size="12" fill="#E6E6E6" text-anchor="middle">prime</text>
  <text x="220" y="55" font-size="12" fill="#E6E6E6" text-anchor="middle">not prime</text>
  <text x="180" y="180" font-size="12" fill="#8a8f98" text-anchor="middle">1 is neither prime nor composite</text>
</svg>
