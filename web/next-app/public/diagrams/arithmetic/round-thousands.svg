<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="180" y="28" font-size="14" fill="#BABABA" text-anchor="middle">4,600: between 4,000 and 5,000</text>
  <line x1="20" y1="110" x2="340" y2="110" stroke="#BABABA" stroke-width="2"/>
  <g font-size="13" fill="#BABABA" text-anchor="middle">
    <text x="45" y="135">4,000</text><text x="180" y="135">4,500</text><text x="315" y="135">5,000</text>
  </g>
  <g stroke="#BABABA" stroke-width="2">
    <line x1="45" y1="104" x2="45" y2="116"/><line x1="180" y1="104" x2="180" y2="116"/>
    <line x1="315" y1="104" x2="315" y2="116"/>
  </g>
  <line x1="180" y1="60" x2="180" y2="110" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4"/>
  <text x="180" y="52" font-size="11" fill="#8a8f98" text-anchor="middle">halfway: round up</text>
  <circle cx="234" cy="110" r="6" fill="#E6E6E6"/>
  <text x="234" y="95" font-size="12" fill="#BABABA" text-anchor="middle">4,600</text>
  <text x="180" y="175" font-size="14" fill="#BABABA" text-anchor="middle">4,600 → 5,000</text>
</svg>
