<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="30" y="28" font-size="14" fill="#BABABA">composite: rectangle with sides &gt; 1</text>
  <g stroke="#BABABA" stroke-width="2" fill="none">
    <rect x="30" y="60" width="120" height="40"/>
    <line x1="70" y1="60" x2="70" y2="100"/><line x1="110" y1="60" x2="110" y2="100"/>
  </g>
  <text x="90" y="125" font-size="13" fill="#BABABA" text-anchor="middle">3 × 4 = 12</text>
  <g stroke="#8a8f98" stroke-width="2" fill="none">
    <line x1="200" y1="60" x2="320" y2="60"/>
    <line x1="200" y1="56" x2="200" y2="64"/><line x1="320" y1="56" x2="320" y2="64"/>
  </g>
  <text x="260" y="85" font-size="13" fill="#8a8f98" text-anchor="middle">7 = 1 × 7 only</text>
  <text x="260" y="105" font-size="13" fill="#8a8f98" text-anchor="middle">prime: a row</text>
  <text x="90" y="155" font-size="13" fill="#BABABA" text-anchor="middle">composite: a rectangle</text>
</svg>
