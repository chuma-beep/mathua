<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="30" y="28" font-size="14" fill="#BABABA">skip-count by 5s: 5, 10, 15, 20</text>
  <line x1="20" y1="110" x2="340" y2="110" stroke="#BABABA" stroke-width="2"/>
  <g font-size="12" fill="#8a8f98" text-anchor="middle">
    <text x="40" y="135">0</text><text x="100" y="135">5</text><text x="160" y="135">10</text>
    <text x="220" y="135">15</text><text x="280" y="135">20</text>
  </g>
  <g fill="#E6E6E6">
    <circle cx="100" cy="110" r="5"/><circle cx="160" cy="110" r="5"/>
    <circle cx="220" cy="110" r="5"/><circle cx="280" cy="110" r="5"/>
  </g>
  <path d="M100,100 Q130,60 160,100 M160,100 Q190,60 220,100 M220,100 Q250,60 280,100" stroke="#8a8f98" stroke-width="2" fill="none"/>
  <text x="180" y="175" font-size="12" fill="#8a8f98" text-anchor="middle">2s, 5s, 10s: same jumps, different sizes</text>
</svg>
