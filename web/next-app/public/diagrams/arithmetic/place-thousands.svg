<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="30" y="28" font-size="14" fill="#BABABA">1,247 = 1 thousand + 2 hundreds + 4 tens + 7 ones</text>
  <g font-size="13" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <rect x="30" y="55" width="60" height="60" fill="none" stroke="#BABABA" stroke-width="2"/>
    <text x="60" y="90">1000</text>
    <rect x="110" y="55" width="44" height="44" fill="none" stroke="#BABABA" stroke-width="2"/>
    <rect x="160" y="55" width="44" height="44" fill="none" stroke="#BABABA" stroke-width="2"/>
    <rect x="220" y="55" width="14" height="60" fill="none" stroke="#BABABA" stroke-width="2"/>
    <rect x="238" y="55" width="14" height="60" fill="none" stroke="#BABABA" stroke-width="2"/>
    <rect x="256" y="55" width="14" height="60" fill="none" stroke="#BABABA" stroke-width="2"/>
    <rect x="274" y="55" width="14" height="60" fill="none" stroke="#BABABA" stroke-width="2"/>
  </g>
  <g font-size="12" fill="#8a8f98" text-anchor="middle">
    <text x="60" y="135">1 × 1000</text>
    <text x="157" y="135">2 × 100</text>
    <text x="254" y="135">4 × 10 + 7</text>
  </g>
  <text x="30" y="170" font-size="13" fill="#BABABA">each place is 10× the one to its right</text>
</svg>
