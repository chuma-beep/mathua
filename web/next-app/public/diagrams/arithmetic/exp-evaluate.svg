<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <g font-size="22" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <text x="90" y="90">2</text>
    <text x="115" y="65" font-size="15" fill="#E6E6E6">4</text>
    <text x="160" y="90">=</text>
    <text x="215" y="90">16</text>
  </g>
  <g font-size="12" fill="#8a8f98" text-anchor="middle">
    <text x="215" y="115">2·2·2·2</text>
  </g>
  <g font-size="13" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <text x="90" y="150">3² = 9</text>
    <text x="200" y="150">10³ = 1000</text>
  </g>
  <text x="180" y="182" font-size="12" fill="#8a8f98" text-anchor="middle">multiply out, then compute</text>
</svg>
