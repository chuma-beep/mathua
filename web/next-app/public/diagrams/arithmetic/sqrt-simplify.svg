<svg width="360" height="200" viewBox="0 0 360 200" xmlns="http://www.w3.org/2000/svg">
  <text x="30" y="28" font-size="14" fill="#BABABA">pull out the biggest perfect square</text>
  <g font-size="18" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <text x="90" y="90">√50</text>
    <text x="160" y="90">=</text>
    <text x="215" y="90">√25·2</text>
  </g>
  <g font-size="18" fill="#BABABA" text-anchor="middle" font-family="monospace">
    <text x="110" y="135">= 5√2</text>
  </g>
  <g font-size="12" fill="#8a8f98" text-anchor="middle">
    <text x="180" y="165">25 is the largest square dividing 50</text>
  </g>
</svg>
