name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the workflow token. Every job here reads the repository and
# nothing else: the Fly deploy authenticates with FLY_API_TOKEN rather than with
# GITHUB_TOKEN, and no step comments, labels or pushes. Without this block the
# token inherits the repository default, which is write for a push to main, so a
# compromised action would carry a write scope it never needed.
permissions:
  contents: read

# A superseded pull-request run is wasted work, so cancel it. Main is different:
# every push must finish, because a green run is what deploys it. The deploy job
# already has its own single-flight group so two mains still cannot race.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: grading/requirements.txt
      - run: pip install -r grading/requirements.txt latex2sympy2 antlr4-python3-runtime==4.7.2
      - run: go mod tidy
      - run: go build ./...
      # Two green pull requests can still land an uncompilable package, because
      # each suite was written against a main that lacked its sibling. That
      # happened twice on 2026-10-23 (three TestCheckPassword declarations in
      # internal/auth, two TestEngine_SettleCurrent in internal/diagnostic).
      # This names the duplicate instead of leaving a compiler error.
      - run: python3 scripts/check_duplicate_tests.py
      # gofmt is the one Go rule the compiler does not enforce, so unformatted
      # code lands and someone reformats it later in an unrelated commit. Two
      # files from one pull request arrived that way on 23 October 2026.
      - run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go test ./...
      - run: make lint-go
      - run: go run scripts/validate_graph.go
      # These two run in `make validate` and were absent here, which is how a
      # solution schema outside the six learner domains sat dead in the corpus
      # (`topo.dimension`) while main stayed green. Both read the corpus rather
      # than a copy of it, so neither needs updating when content grows.
      - run: go run ./cmd/validate-mastery-units
      - run: python3 scripts/audit_lessons.py
      - run: python3 scripts/audit_solutions.py
      - run: python3 scripts/counts.py --check
      - run: go test ./internal/generator/... -run TestFuzz -count 100 -timeout 120s
      - run: python scripts/verify_examples.py
      - run: python scripts/lint_prose_display.py
      - run: python scripts/lint_hypothesis.py
      - run: python scripts/lint_notation.py
      - run: python3 scripts/lint_math_layout.py
      # Reports, does not gate. The corpus currently has ~517 malformed spans
      # (mostly Unicode apostrophes where LaTeX wants ASCII), so a hard gate would
      # block main on pre-existing content rather than on a regression. Flip
      # continue-on-error to false once that count reaches zero.
      - name: LaTeX corpus check (report only)
        continue-on-error: true
        run: cd web/next-app && node scripts/normalize-latex.mjs --quiet
      - name: Fail on verifier FAILs
        run: |
          python -c "
          import json
          r=json.load(open('scripts/verify_report.json'))
          fails=[e for e in r if e['verdict']=='FAIL']
          assert not fails, f'{len(fails)} verifier FAILs:\n' + '\n'.join(f\"{e['file']}:{e['line']} {e['latex'][:80]}\" for e in fails[:5])
          "
          python -c "
          import json
          r=json.load(open('scripts/prose_display_report.json'))
          assert not r, f'{len(r)} prose-display mismatches'
          r=json.load(open('scripts/hypothesis_report.json'))
          assert not r, f'{len(r)} hypothesis issues'
          # notation report is informational (log/ln intentional)
          "

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      # The docs bundle is built and compared in the advisory `docs` job, not here.
      # A stale generated file is a documentation defect, and documentation must not
      # be able to stop a release (see the `docs` job comment).
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run lint:antislop
      - run: npm test
      # Point the export at a documentation address, not the deployed API. A normal
      # build reads web/next-app/.env.production and bakes https://mathua.fly.dev
      # into every page, so a spec whose stub misses its URL is answered by
      # production — it passed on a fast reply and could hang on a slow one, and
      # e2e traffic reached the live service for that reason. 192.0.2.1 never
      # answers, so a missed stub cannot leave the runner.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://192.0.2.1:9099
      # This build is not what the e2e shards use: `build` publishes
      # `web-build-e2e` for them, so they no longer wait for this job. It stays
      # here because `web` is one of the seven required checks, and that is the
      # job that must fail when the export cannot be produced — a failing `build`
      # job would otherwise reach a merge only through a skipped shard.
      # The artifact this job used to upload (web-build) had no consumer left
      # once the shards moved, so it is gone rather than left as a trap.
      # Repo-root: aislop reads .aislop/config.yml (excludes vendored/generated).
      #
      # This runs last on purpose. It exits 1 on any error, and a failed step skips
      # every step after it: on two consecutive pushes a single finding here meant
      # npm test, npm run build and both Playwright shards never ran, so the commit
      # was neither tested nor deployed. The step used to be named "soft gate -
      # reports, never fails", which was false in the same way. It is a hard gate
      # and it is now placed where being hard costs only itself.
      - name: aislop security scan (fails on error)
        working-directory: ${{ github.workspace }}
        run: npx --yes aislop@0.16.1 ci --human
      # A failing e2e run used to leave nothing behind: the config retains a trace and writes an HTML
      # report, and this job uploaded neither, so the only evidence was the assertion text in the log.
      # The trace has the DOM snapshot, the network log and the screenshots.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/next-app/playwright-report
            web/next-app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # The shards need the export, not the whole `web` job: typecheck, lint, unit
  # tests and the build share one 214-second job, so the shards could not start
  # until all of it finished. This job produces the same artifact on the same
  # commit, so the shards start as soon as the export exists. `web` keeps its
  # steps and its name, and a broken build still fails the pipeline because the
  # shards need this job.
  build:
    name: Build the web export
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://192.0.2.1:9099
      - uses: actions/upload-artifact@v7
        with:
          name: web-build-e2e
          path: web/next-app/out
          retention-days: 1

  web-e2e:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web/next-app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/next-app/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: web-build-e2e
          path: web/next-app/out
      # Without this cache the browser download dominated the job. With it, the apt
      # half dominated: `--with-deps` fetched 25.9 MB from azure.archive.ubuntu.com
      # at 44 kB/s and took 9m49s on 23 October 2026, which turned a 4-minute shard
      # into a 15-minute one. The Ubuntu 24.04 runner image already carries the
      # libraries Chromium needs, so install only the browser. If a library is ever
      # missing, Chromium refuses to launch on the first test rather than quietly
      # skipping it; put `--with-deps` back for that one run.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/next-app/package-lock.json') }}
      - run: npx playwright install chromium
      # Sharded single-worker e2e: the graph and 3D suites crash Chromium
      # ("session closed") when two heavy specs share a runner. Two shards on two
      # runners keeps that isolation and runs them at the same time.
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          PW_WORKERS: 1
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            web/next-app/playwright-report
            web/next-app/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Documentation correctness is reported, not enforced. It used to run inside
  # `test` and `web`, both of which `deploy` needs, so a stale line number in a
  # sentence could skip a release of working code — which is exactly what
  # happened: two citations drifted when a function moved and the deploy never
  # ran. Keeping these checks blocking would keep that failure mode.
  #
  # The deliberate trade-off: a documentation error can now reach production
  # unnoticed. That is accepted because the checks are about prose and generated
  # content, while the tests, builds, e2e shards, image build and Postgres parity
  # that prove the product works stay blocking.
  #
  # `continue-on-error` keeps each step reporting even when an earlier one fails,
  # so this job is green but every failure is visible as an annotation.
  docs:
    name: Documentation (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: web/next-app/package-lock.json
      - name: Docs agree with the code and the corpus
        continue-on-error: true
        run: python3 scripts/check_docs.py
      - name: Procedural prose follows the STE subset
        continue-on-error: true
        run: python3 scripts/check_ste.py
      - name: Oxford comma report
        continue-on-error: true
        run: python3 scripts/check_oxford_comma.py
      - name: The published docs bundle matches its sources
        continue-on-error: true
        working-directory: web/next-app
        run: |
          npm ci --no-audit --no-fund
          npm run docs:check

  docker:
    name: Build production image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The Dockerfile's grading self-test fails the build if SymPy cannot
      # grade, so this gates deploy on a working production grading runtime.
      - run: docker build -t mathua:ci .

  postgres:
    name: Postgres parity
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: mathua
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum
      - name: Postgres parity and AI usage
        run: go test ./internal/storage/... -run 'TestParity|TestAIUsage' -v
        env:
          TEST_POSTGRES_DSN: postgres://pg:pg@localhost:5432/mathua?sslmode=disable
      # The AI quota is concurrent by design — the whole point of reserving both
      # counters in one transaction is that two requests racing for the last slot
      # cannot both win — so the quota and failover tests run under the race
      # detector too, and the storage ones run against Postgres, where the row
      # locks and the rollback that make the reserve atomic actually exist.
      - name: AI concurrency under the race detector
        run: go test -race ./internal/ai/... ./internal/storage/... ./internal/server/... -run 'TestAIUsage|Quota|AI|RateLimit|TrustedIP' -count=1
        env:
          TEST_POSTGRES_DSN: postgres://pg:pg@localhost:5432/mathua?sslmode=disable

  # The parity job above compares selected scenarios. This one runs the whole
  # storage suite against the engine production does not use yet: a method that
  # behaves differently there cannot hide behind a filter. It found three real
  # Postgres defects on its first run (a shared league insert written with SQLite
  # placeholders, an active-session upsert with one placeholder too few, and a
  # REAL column that turned 1.4 into 1.39999997).
  storage-postgres:
    name: Storage suite on Postgres
    runs-on: ubuntu-24.04
    # Set once, at job level, so the guard below and the test step read the same
    # value. A step-level env would let the guard pass on its own copy while the
    # test step ran with none.
    env:
      TEST_POSTGRES_DSN: postgres://pg:pg@localhost:5432/mathua?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pg
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: mathua
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
          cache-dependency-path: go.sum
      # The suite falls back to SQLite when the DSN is absent, so a removed
      # environment block would leave this required check green while testing
      # the engine it was added to exclude.
      - name: Require the Postgres DSN
        run: |
          if [ -z "${TEST_POSTGRES_DSN}" ]; then
            echo "TEST_POSTGRES_DSN is empty: the storage suite would test SQLite."
            exit 1
          fi
      - name: Every storage test on Postgres
        run: go test ./internal/storage/ -count=1 -v

  deploy:
    name: Deploy to Fly.io
    needs: [test, web, web-e2e, docker, postgres]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    # One deploy at a time. Two pushes in quick succession each trigger a deploy, and two flyctl
    # deploys race for the same machine's lease: the loser dies with "Failed to acquire lease for
    # VM ... lease currently held by ...", which reads as a red run on a commit whose tests all
    # passed. Queuing rather than cancelling keeps the newer commit as the one left running.
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # The scope step diffs against the previous head of main, which a
          # depth-1 clone does not contain.
          fetch-depth: 0
      # Every push to main redeployed, including a typo fix in CONTRIBUTING.md,
      # which restarted the API for a prose change. This classifies the push and
      # skips only the deploy step; every required check still runs, because the
      # skip lives here rather than in a workflow-level path filter, where a
      # filtered-out workflow leaves its checks pending and blocks every merge.
      #
      # Documentation means markdown at the repository root, anything under
      # docs/, and the licence. `data/lessons/*.md` is not documentation: those
      # files are served as lesson content, so they fall through to a deploy.
      # An unreadable base or an empty change set deploys, because a missed
      # deploy is a worse failure than a redundant one.
      - name: Classify the push
        id: scope
        run: |
          set -eu
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
            echo "No usable base commit; a deploy is the safe default."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$before" '${{ github.sha }}')
          if [ -z "$changed" ]; then
            echo "Empty change set; a deploy is the safe default."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          docs_only=true
          while IFS= read -r path; do
            case "$path" in
              docs/*|LICENSE) ;;
              */*) docs_only=false; echo "not documentation: $path" ;;
              *.md) ;;
              *) docs_only=false; echo "not documentation: $path" ;;
            esac
          done <<< "$changed"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation only: $docs_only"
      # Installed from Fly's own installer rather than through a third-party
      # action. That action declares a Node runtime GitHub is retiring and it
      # ran in the one job that holds the deploy token, so removing it drops a
      # dependency from the most privileged place in the pipeline.
      #
      # The version is pinned for the same reason the runner image is: an
      # unpinned installer makes deploy behaviour depend on the day rather than
      # on the commit. The check afterwards fails the job if the installer
      # silently falls back to latest, because a mismatched version discovered
      # during a deploy is worse than a failed install.
      - name: Install flyctl
        if: steps.scope.outputs.docs_only != 'true'
        env:
          FLYCTL_VERSION: v0.4.122
        run: |
          set -eu
          curl -fsSL https://fly.io/install.sh | sh -s -- "$FLYCTL_VERSION"
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version
          if ! "$HOME/.fly/bin/flyctl" version | grep -qF "$FLYCTL_VERSION"; then
            echo "installed flyctl is not $FLYCTL_VERSION" >&2
            exit 1
          fi
      - run: flyctl deploy --remote-only --wait-timeout 300
        if: steps.scope.outputs.docs_only != 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}